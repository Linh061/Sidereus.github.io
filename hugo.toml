baseURL = 'https://linh061.github.io/Sidereus.github.io/'
languageCode = 'zh-cn'
title = "Sidereus's Blog"
theme = 'PaperMod'

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$']]
inline = [['$', '$']]

[params]
  math = true
  comments = true
  mainSections = ["posts"] 

[params.profileMode]
  enabled = true
  title = "Sidereus"
  subtitle = "A pharmacy student who is passionate about computer science."
  imageUrl = "images/Lain-computer.jpg"
  imageWidth = 150
  imageHeight = 150

[[params.profileMode.buttons]]
    name = "Article List"
    url = "/posts/"

[[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/Linh061"